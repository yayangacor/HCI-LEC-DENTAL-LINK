<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Link</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="schedule2.css">
    <script src="schedule2.js" defer></script>

</head>
<body>
    <aside class="sidebar">

  <div class="logo-container">
    <div class="logo-icon">
      <i class="fa-solid fa-stethoscope"></i>
    </div>
    <h1 class="logo-title">Dental Link</h1>
  </div>

  <div class="user-card-wrapper">
    <div class="user-card">
      <div class="user-avatar">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=DrSmith" alt="Foto Dr. Smith">
      </div>
      <div class="user-info">
        <p class="name">Dr. Smith</p>
        <p class="role">Clinical Director</p>
      </div>
    </div>
  </div>

  <div class="sidebar-action">
    <button class="btn-new-appointment">
    <i class="fa-solid fa-plus"></i>
    <span>Janji Temu Baru</span>
    </button>
  </div>

  <nav class="nav-container">
    <a href="dashboard2.html" class="nav-item">
      <i class="fa-solid fa-chart-line"></i>
      <span>Dashboard</span>
    </a>

    <a href="patients2.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>Pasien</span>
    </a>

    <a href="schedule2.html" class="nav-item active">
      <i class="fa-solid fa-calendar-days"></i>
      <span>Jadwal</span>
    </a>

    <a href="odontogram2.html" class="nav-item">
      <i class="fa-solid fa-tooth"></i>
      <span>Rekam Medis</span>
    </a>

    <a href="chat2.html" class="nav-item nav-item-chat">
      <div class="nav-item-chat-inner">
        <i class="fa-solid fa-comments"></i>
        <span>Chat Pasien</span>
      </div>
      <span class="badge">2</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item">
      <i class="fa-solid fa-gear"></i>
      <span>Pengaturan</span>
    </button>

    <button class="nav-item">
      <i class="fa-solid fa-circle-question"></i>
      <span>Bantuan</span>
    </button>
  </div>

</aside>

<!-- MAIN WRAPPER -->
<div class="main-wrapper">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" placeholder="Cari jadwal..." class="search-input">
    </div>

    <div class="topbar-actions">
      <button class="btn-icon">
        <i class="fa-solid fa-bell"></i>
        <span class="notification-dot"></span>
      </button>

      <div class="user-avatar-initials">
        DS
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="content-area">
    <div class="header-section">
      <div class="header-title">
        <h2>Jadwal</h2>
        <p>Kamis, 24 Mei 2024</p>
      </div>

      <div class="navigation-controls">
        <button class="btn-nav-control">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button class="btn-today">
          Hari Ini
        </button>

        <button class="btn-nav-control">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- CALENDAR -->
    <div id="calendar-grid" class="calendar-grid">
      <!-- RENDER OLEH JAVASCRIPT -->
    </div>
  </main>

</div>
</body>
</html>
