<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Link</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">

  <div class="logo-container">
    <div class="logo-icon">
      <i class="fa-solid fa-stethoscope"></i>
    </div>
    <h1 class="logo-title">Dental Link</h1>
  </div>

  <div class="user-card-wrapper">
    <div class="user-card">
      <div class="user-avatar">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=SarahConnor&backgroundColor=b6e3f4" alt="Avatar Sarah Connor">
      </div>
      <div class="user-info">
        <p class="name">Sarah Connor</p>
        <p class="role">Pasien Premium</p>
      </div>
    </div>
  </div>

  <nav class="nav-container">
    <a href="dashboard.html" class="nav-item">
      <i class="fa-solid fa-chart-line"></i>
      <span>Dashboard</span>
    </a>

    <a href="schedule.html" class="nav-item active">
      <i class="fa-solid fa-calendar-days"></i>
      <span>Jadwal</span>
      <span class="badge-red">1</span>
    </a>

    <a href="prescriptions.html" class="nav-item">
      <i class="fa-solid fa-prescription-bottle-medical"></i>
      <span>Preskripsi</span>
    </a>

    <a href="odontogram.html" class="nav-item">
      <i class="fa-solid fa-tooth"></i>
      <span>Odontogram</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item">
      <i class="fa-solid fa-gear"></i>
      <span>Pengaturan</span>
    </button>

    <button class="nav-item">
      <i class="fa-solid fa-circle-question"></i>
      <span>Bantuan</span>
    </button>
  </div>

</aside>

<!-- MAIN WRAPPER -->
<div class="main-wrapper">

  <!-- TOPBAR -->
  <header class="topbar">
    <h2 class="topbar-title">Jadwal Kunjungan</h2>

    <div class="topbar-actions">
      <button class="btn-notification">
        <i class="fa-solid fa-bell"></i>
        <span class="notification-dot"></span>
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="content-area fade-in">
    <div class="content-header">
      <h2>Jadwal Kunjungan</h2>
      <p>Kelola janji temu Anda dengan dokter.</p>
    </div>

    <!-- TABS CARD -->
    <div class="tabs-card">
      <div class="tabs-header">
        <button class="tab-btn active">Akan Datang</button>
        <button class="tab-btn">Riwayat</button>
      </div>

      <!-- LIST -->
      <div id="schedule-list" class="schedule-list">
        <!-- RENDERED BY JAVASCRIPT -->
      </div>
    </div>
  </main>

</div>

<!-- TOAST CONTAINER -->
<div id="toast-container" class="toast-container"></div>
</body>
</html>
