<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Link - Patients</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="patients2.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-stethoscope"></i>
            </div>
            <h1 class="brand-title">Dental Link</h1>
        </div>

        <div class="profile-section">
            <div class="profile-card">
                <div class="profile-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=DrSmith" alt="Doctor">
                </div>
                <div class="profile-info">
                    <p class="profile-name">Dr. Smith</p>
                    <p class="profile-role">Clinical Director</p>
                </div>
            </div>
        </div>

        <div class="action-section">
            <button class="btn-appointment">
                <i class="fa-solid fa-plus"></i>
                <span>Janji Temu Baru</span>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard2.html" class="nav-item">
                <i class="fa-solid fa-chart-line nav-icon"></i>
                <span>Dashboard</span>
            </a>
            <a href="patients2.html" class="nav-item active">
                <i class="fa-solid fa-users nav-icon"></i>
                <span>Pasien</span>
            </a>
            <a href="schedule2.html" class="nav-item">
                <i class="fa-solid fa-calendar-days nav-icon"></i>
                <span>Jadwal</span>
            </a>
            <a href="odontogram2.html" class="nav-item">
                <i class="fa-solid fa-tooth nav-icon"></i>
                <span>Rekam Medis</span>
            </a>
            <a href="chat2.html" class="nav-item justify-between">
                <div class="nav-left">
                    <i class="fa-solid fa-comments nav-icon"></i>
                    <span>Chat Pasien</span>
                </div>
                <span class="badge">2</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="nav-item">
                <i class="fa-solid fa-gear nav-icon"></i>
                <span>Pengaturan</span>
            </button>
            <button class="nav-item">
                <i class="fa-solid fa-circle-question nav-icon"></i>
                <span>Bantuan</span>
            </button>
        </div>
    </aside>

    <div class="main-wrapper">

        <header class="topbar">
            <div class="topbar-left">
                <button id="hamburger-toggle" class="btn-hamburger">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Cari pasien..." class="search-input">
                </div>
            </div>
            
            <div class="topbar-actions">
                <button class="notification-btn">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-dot"></span>
                </button>
                <div class="user-avatar">DS</div>
            </div>
        </header>

        <main class="content">
            <div class="page-header">
                <div>
                    <h2 class="page-title">Direktori Pasien</h2>
                    <p class="page-subtitle">Total 1,284 pasien terdaftar dalam sistem.</p>
                </div>
                <button class="btn-primary">
                    <i class="fa-solid fa-plus"></i>
                    Tambah Pasien Baru
                </button>
            </div>

            <div class="data-card">
                <div class="tabs">
                    <button class="tab-btn active">Semua Pasien</button>
                    <button class="tab-btn">Baru Saja Ditambah</button>
                    <button class="tab-btn">Pasca-Op</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Pasien</th>
                                <th>Kontak</th>
                                <th>Kunjungan Terakhir</th>
                                <th>Kondisi Medis</th>
                                <th class="text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="patients-list">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="patients2.js"></script>
</body>
</html>
