<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dental Link</title>

    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Login Card -->
    <div class="login-card">

        <!-- Top Accent -->
        <div class="card-accent"></div>

        <div class="card-content">

            <!-- Logo -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fa-solid fa-tooth"></i>
                    <h1>Dental Link</h1>
                </div>
                <p class="welcome-text">
                    Selamat datang kembali
                </p>
            </div>

            <!-- Role Selector -->
            <div class="role-selector">
                <button
                    id="btn-pasien"
                    onclick="setRole('pasien')"
                    class="role-btn active"
                >
                    Pasien
                </button>

                <button
                    id="btn-dokter"
                    onclick="setRole('dokter')"
                    class="role-btn inactive"
                >
                    Dokter
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">

                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="emailInput"
                            placeholder="Masukkan email anda"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="password-header">
                        <label>Kata Sandi</label>
                        <a href="#">
                            Lupa kata sandi?
                        </a>
                    </div>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="passwordInput"
                            placeholder="Masukkan kata sandi"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="toggle-password"
                        >
                            <i id="eyeIcon" class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <!-- Container untuk Pesan Error -->
                <div id="loginError" class="error-box" style="display: none;"></div>

                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    Masuk
                </button>

            </form>

            <!-- Footer -->
            <p class="footer-text">
                Belum punya akun?
                <a href="register.html">
                    Daftar sekarang
                </a>
            </p>

        </div>

    </div>

    <!-- Menghubungkan ke file JavaScript validasi eksternal -->
    <script src="login.js"></script>

</body>
</html>
